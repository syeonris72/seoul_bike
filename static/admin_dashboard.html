<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>따릉이 관제 - 관제 지도</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="css/admin_dashboard.css">
</head>
<body>

  <div id="app-header"></div>

  <div class="dashboard">
    <!-- 데스크탑 좌측 패널 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-status-embed">
        <div class="tab-group panel-tabs mb-2 left-tab-group">
          <button type="button" class="left-tab-btn active" data-tab="map">지도현황</button>
          <button type="button" class="left-tab-btn" data-tab="dispatch">지시서 <span class="tab-count-badge dispatch-count-badge">0</span></button>
        </div>

        <div class="left-pane-map">
          <div class="status-embed-title-row">
            <span class="status-embed-title">스테이션 현황</span>
            <span class="status-count station-count-label"></span>
          </div>
          <div class="status-list station-list"></div>
        </div>

        <div class="left-pane-dispatch" style="display:none;">
          <div class="status-embed-title-row">
            <span class="status-embed-title">지시서 목록</span>
            <span class="status-count dispatch-count-label"></span>
          </div>
          <div class="status-list dispatch-pane-list"></div>
        </div>
      </div>
    </aside>

    <!-- 지도 영역 -->
    <div class="map-stage">
      <div class="map-card" id="kakao-map">
        <div class="map-surface"></div>

        <!-- 자치구 / 행정동 토글 -->
        <div class="floating-filter-wrap" id="mapFilterBar">
          <div class="region-select-area">
            <button type="button" class="region-select-btn" id="districtDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="자치구 선택">
              <span id="selectedDistrictLabel">전체 자치구</span>
              <i class="bi bi-chevron-down"></i>
            </button>
            <ul class="dropdown-menu region-dropdown-menu" id="districtDropdownList" aria-labelledby="districtDropdownBtn"></ul>
          </div>
          <div class="region-select-area">
            <button type="button" class="region-select-btn" id="dongDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="행정동 선택" disabled>
              <span id="selectedDongLabel">전체 행정동</span>
              <i class="bi bi-chevron-down"></i>
            </button>
            <ul class="dropdown-menu region-dropdown-menu" id="dongDropdownList" aria-labelledby="dongDropdownBtn"></ul>
          </div>
        </div>

        <!-- 스테이션 상태 필터칩 (하단, user_dashboard와 동일한 패턴) -->
        <div class="map-filter-panel" id="mapStatusFilter" aria-label="스테이션 상태 필터"></div>

        <button type="button" class="status-reopen-pill" id="statusReopenPill" aria-label="현황 패널 다시 열기">관제 현황</button>
      </div>
    </div>

    <!-- 모바일 하단 바텀시트 -->
    <div class="status-panel" id="statusPanel">
      <button class="status-panel-handle" id="statusPanelToggle" type="button" aria-expanded="true" aria-controls="statusPanelBody">
        <span class="bar"></span>
        <span class="row"><span class="title">관제 현황</span><span class="count mobile-total-count"></span></span>
      </button>
      <div class="status-panel-body" id="statusPanelBody">
        <div class="tab-group panel-tabs mb-2 left-tab-group">
          <button type="button" class="left-tab-btn active" data-tab="map">지도현황</button>
          <button type="button" class="left-tab-btn" data-tab="dispatch">지시서 <span class="tab-count-badge dispatch-count-badge">0</span></button>
        </div>

        <div class="left-pane-map">
          <div class="status-embed-title-row">
            <span class="status-embed-title">스테이션 현황</span>
            <span class="status-count station-count-label"></span>
          </div>
          <div class="status-list station-list"></div>
        </div>

        <div class="left-pane-dispatch" style="display:none;">
          <div class="status-embed-title-row">
            <span class="status-embed-title">지시서 목록</span>
            <span class="status-count dispatch-count-label"></span>
          </div>
          <div class="status-list dispatch-pane-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 스테이션 상세 팝업 -->
  <div class="station-detail-backdrop" id="stationDetailBackdrop"></div>
  <div class="station-detail-panel" id="stationDetailPanel">
    <div class="sd-header">
      <h3 class="sd-title" id="sdTitle">대여소명</h3>
      <button class="sd-close-btn" id="sdCloseBtn"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="sd-body">
      <p class="sd-addr" id="sdAddr">주소</p>
      <span class="badge sd-status-badge" id="sdStatusBadge">-</span>
      <div class="sd-stats">
        <div class="sd-stat-item"><span class="label">일반 자전거</span><strong id="sdGeneral">0대</strong></div>
        <div class="sd-stat-item"><span class="label">새싹 자전거</span><strong id="sdSprout">0대</strong></div>
        <div class="sd-stat-item"><span class="label">거치대 수</span><strong id="sdCapacity">0면</strong></div>
      </div>
      <button type="button" class="sd-write-btn" id="sdWriteOrderBtn">
        <i class="bi bi-pencil-square me-2"></i>지시서 쓰기
      </button>
    </div>
  </div>

  <!-- 지시서 상세 팝업 -->
  <div class="station-detail-backdrop" id="orderDetailBackdrop"></div>
  <div class="station-detail-panel" id="orderDetailPanel">
    <div class="sd-header">
      <h3 class="sd-title" id="odTitle">지시서</h3>
      <button class="sd-close-btn" id="odCloseBtn"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="sd-body">
      <p class="sd-addr" id="odMeta">-</p>
      <span class="badge sd-status-badge" id="odStatusBadge">-</span>
      <div class="sd-stats">
        <div class="sd-stat-item"><span class="label">일반</span><strong id="odGeneral">0대</strong></div>
        <div class="sd-stat-item"><span class="label">새싹</span><strong id="odSprout">0대</strong></div>
        <div class="sd-stat-item"><span class="label">담당 기사</span><strong id="odDriver">-</strong></div>
      </div>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="js/header.js"></script>
  <script src="js/mock_data.js"></script>
  <script src="js/admin_dashboard.js"></script>
</body>
</html>
