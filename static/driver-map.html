<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울자전거 따릉이 - 경로 지도</title>
  <link rel="icon" type="image/png" href="img/web-logo-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="css/driver-map.css?v=20260728a">
</head>
<body>

  <div id="app-header"></div>

  <div class="driver-map-wrap">
    <div class="map-stage">
      <div class="map-card" id="routeMap">
        <div id="kakaoMapContainer" class="kakao-map-container"></div>
        <div class="map-title-badge"><i class="bi bi-geo-alt-fill"></i> 오늘 방문할 대여소 · <span id="routeCount">0곳</span></div>
        <div class="route-legend">
          <div><span class="legend-dot start"></span>수거 대여소</div>
          <div><span class="legend-dot end"></span>배치 대여소</div>
          <div><span class="legend-dot report"></span>고장 수거</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 대여소 마커 클릭 시 뜨는 팝업: 대여소 정보 + 외부 내비게이션 앱 연동 버튼 -->
  <div class="pin-popup-backdrop" id="pinPopupBackdrop"></div>
  <div class="pin-popup" id="pinPopup" role="dialog" aria-hidden="true">
    <button type="button" class="pin-popup-close-btn" id="pinPopupCloseBtn"><i class="bi bi-x-lg"></i></button>
    <span class="pin-popup-role-tag" id="pinPopupRoleTag">수거 · -0대</span>
    <h3 class="pin-popup-station-name" id="pinPopupStationName">대여소명</h3>
    <p class="pin-popup-addr" id="pinPopupAddr">주소</p>
    <div class="pin-popup-nav-buttons">
      <a class="pin-popup-nav-btn kakao" id="pinPopupKakaoBtn" target="_blank" rel="noopener"><i class="bi bi-map-fill"></i> 카카오내비로 길안내</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/kakao-map.js"></script>
  <script src="js/header.js"></script>
  <script src="js/driver-map.js"></script>
</body>
</html>
