<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>서울자전거 따릉이 - 지시서 관리</title>
    <link rel="icon" type="image/png" href="img/web-logo-icon.png">
    <!-- Bootstrap 5.3.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 공통 헤더 CSS -->
    <link rel="stylesheet" href="css/header.css" />
    <!-- 지시서 관리 전용 CSS -->
    <link rel="stylesheet" href="css/admin-dispatch.css?v=20260728b" />
</head>
<body>
<!-- 공유 헤더 컴포넌트 삽입 위치 -->
<div id="app-header"></div>

<div class="container-fluid px-4 dispatch-page-container">
    <!-- 헤더 영역 -->
    <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-3">
        <div>
            <h2 class="page-title">지시서 관리</h2>
            <div class="page-subtitle">자치구별 재배치 지시서 작성·관리</div>
        </div>
        <div class="d-flex align-items-center gap-3 flex-wrap header-action-group">
            <button type="button" class="btn ai-tab-btn" id="aiRecommendTabBtn">
                <i class="bi bi-stars"></i> AI 자동 추천
            </button>
            <button type="button" class="btn btn-write-order px-4" id="openWriteModalBtn">
                <i class="bi bi-plus-lg"></i> 지시서 작성
            </button>
        </div>
    </div>

    <!-- 일반 리스트 뷰 -->
    <div id="normalListSection">
        <!-- 상태별 필터: driver-dashboard(지시서 목록) 페이지와 동일한 드롭다운 토글 UI -->
        <div class="d-flex mb-4">
            <div class="status-select-area position-relative" id="statusTabs">
                <button type="button" class="status-select-btn" id="statusDropdownBtn" aria-expanded="false" aria-label="상태 필터 선택">
                    <span id="statusSelectedLabel">전체</span> <span class="count" id="statusSelectedCount">0</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>
                <ul class="dropdown-menu status-dropdown-menu" id="statusFilterList" aria-labelledby="statusDropdownBtn">
                    <li><a class="dropdown-item selected-item" href="#" data-status="all">전체 <span class="count" id="count-all">0</span></a></li>
                    <li><a class="dropdown-item" href="#" data-status="대기">대기 <span class="count" id="count-waiting">0</span></a></li>
                    <li><a class="dropdown-item" href="#" data-status="진행중">수행 중 <span class="count" id="count-doing">0</span></a></li>
                    <li><a class="dropdown-item" href="#" data-status="완료">완료 <span class="count" id="count-done">0</span></a></li>
                </ul>
            </div>
        </div>

        <!-- 지시서 목록: 자치구별 박스로 항상 분리해 표시 -->
        <div id="districtColumns" class="task-columns mb-5"></div>
    </div>

</div>

<!-- [모달] AI 자동 추천 재배치 -->
<div class="modal fade" id="aiRecommendModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">AI 자동 추천</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="ai-recommend-card border-0 p-0">
                    <div class="ai-recommend-header">
                        <div class="ai-recommend-subtitle mt-0">실시간 재고 데이터를 분석해 우선순위가 높은 재배치 건을 자동으로 추천합니다.</div>
                    </div>
                    <div class="ai-select-all-row">
                        <input type="checkbox" id="aiSelectAll">
                        <label for="aiSelectAll">전체 선택</label>
                        <span class="ai-selected-count" id="aiSelectedCount">0건 선택됨</span>
                    </div>
                    <div id="aiRecommendList"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-send-selected w-100" id="sendSelectedBtn">선택 항목 일괄 발송</button>
            </div>
        </div>
    </div>
</div>

<!-- [모달] 지시서 작성 폼 -->
<div class="modal fade" id="dispatchModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">지시서 작성</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <div class="row g-4">
                    <!-- 좌측: 지시 내용 (경로, 수량) -->
                    <div class="col-lg-6">
                        <!-- 긴급 토글 -->
                        <div class="form-section emergency-box">
                            <div>
                                <h6>긴급 지시서</h6>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="emergencyToggle">
                            </div>
                        </div>

                        <!-- 재배치 경로: 출발지 -->
                        <div class="form-section">
                            <label class="section-title"><i class="bi bi-circle-fill text-danger me-1 section-title-dot"></i> 수거 대여소</label>
                            <div class="row g-2">
                                <div class="col-12 col-sm-4">
                                    <div class="cascade-select-area">
                                        <button type="button" class="cascade-select-btn" id="fromDistrictBtn" aria-expanded="false"><span id="fromDistrictLabel">자치구</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
                                        <ul class="dropdown-menu cascade-dropdown-menu" id="fromDistrictMenu"></ul>
                                        <select class="d-none" id="fromDistrictSelect"><option value="">자치구</option></select>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-4">
                                    <div class="cascade-select-area">
                                        <button type="button" class="cascade-select-btn" id="fromDongBtn" aria-expanded="false" disabled><span id="fromDongLabel">행정동</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
                                        <ul class="dropdown-menu cascade-dropdown-menu" id="fromDongMenu"></ul>
                                        <select class="d-none" id="fromDongSelect" disabled><option value="">행정동</option></select>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-4">
                                    <div class="cascade-select-area">
                                        <button type="button" class="cascade-select-btn" id="fromStationBtn" aria-expanded="false" disabled><span id="fromStationLabel">대여소</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
                                        <ul class="dropdown-menu cascade-dropdown-menu" id="fromStationMenu"></ul>
                                        <select class="d-none" id="fromStationSelect" disabled><option value="">대여소</option></select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 재배치 경로: 도착지 -->
                        <div class="form-section">
                            <label class="section-title"><i class="bi bi-circle-fill text-success me-1 section-title-dot"></i> 배치 대여소</label>
                            <div class="row g-2">
                                <div class="col-12 col-sm-4">
                                    <div class="cascade-select-area">
                                        <button type="button" class="cascade-select-btn" id="toDistrictBtn" aria-expanded="false"><span id="toDistrictLabel">자치구</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
                                        <ul class="dropdown-menu cascade-dropdown-menu" id="toDistrictMenu"></ul>
                                        <select class="d-none" id="toDistrictSelect"><option value="">자치구</option></select>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-4">
                                    <div class="cascade-select-area">
                                        <button type="button" class="cascade-select-btn" id="toDongBtn" aria-expanded="false" disabled><span id="toDongLabel">행정동</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
                                        <ul class="dropdown-menu cascade-dropdown-menu" id="toDongMenu"></ul>
                                        <select class="d-none" id="toDongSelect" disabled><option value="">행정동</option></select>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-4">
                                    <div class="cascade-select-area">
                                        <button type="button" class="cascade-select-btn" id="toStationBtn" aria-expanded="false" disabled><span id="toStationLabel">대여소</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
                                        <ul class="dropdown-menu cascade-dropdown-menu" id="toStationMenu"></ul>
                                        <select class="d-none" id="toStationSelect" disabled><option value="">대여소</option></select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 수량 카운터 -->
                        <div class="form-section mb-0">
                            <label class="section-title">따릉이 수량</label>
                            <div class="counter-grid">
                                <div class="counter-box">
                                    <span class="bike-label">일반 따릉이 <span class="max-label" id="normalMaxLabel">(최대 0대)</span></span>
                                    <div class="counter-controls">
                                        <button type="button" class="counter-btn counter-btn-minus" data-count-type="normal" data-count-delta="-1">-</button>
                                        <span class="counter-val" id="normalCount">0</span>
                                        <button type="button" class="counter-btn counter-btn-plus" data-count-type="normal" data-count-delta="1">+</button>
                                    </div>
                                </div>
                                <div class="counter-box">
                                    <span class="bike-label">새싹 따릉이 <span class="max-label" id="sproutMaxLabel">(최대 0대)</span></span>
                                    <div class="counter-controls">
                                        <button type="button" class="counter-btn counter-btn-minus" data-count-type="sprout" data-count-delta="-1">-</button>
                                        <span class="counter-val" id="sproutCount">0</span>
                                        <button type="button" class="counter-btn counter-btn-plus" data-count-type="sprout" data-count-delta="1">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 우측: 배정 및 기타 사항 (기사 배정, 메모) -->
                    <div class="col-lg-6 d-flex flex-column">
                        <!-- 기사 배정 -->
                        <div class="form-section flex-grow-1">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <label class="section-title mb-0">담당 기사 배정</label>
                                <span class="badge bg-light text-secondary border" id="driverWaitingBadge">대기 중 0명</span>
                            </div>

                            <!-- 기사 리스트 -->
                            <div class="driver-list" id="driverList"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-write-order w-100 py-2" id="submitOrderBtn" disabled>✈ 지시서 전송</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5.3.3 JS Bundle CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- 백엔드 호출 헬퍼 -->
<script src="js/api.js"></script>
<!-- 공통 헤더 JS -->
<script src="js/header.js?v=20260802a"></script>
<!-- 지시서 관리 전용 JS -->
<script src="js/admin-dispatch.js?v=20260726e"></script>
</body>
</html>
