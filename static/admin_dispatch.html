<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지시서 관리 - 따릉이 관제</title>
    <!-- Bootstrap 5.3.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 공통 헤더 CSS -->
    <link rel="stylesheet" href="css/header.css" />
    <!-- 지시서 관리 전용 CSS -->
    <link rel="stylesheet" href="css/admin_dispatch.css" />
</head>
<body>
<!-- 공유 헤더 컴포넌트 삽입 위치 -->
<div id="app-header"></div>

<div class="container-fluid px-4 pt-4" style="max-width: 1600px;">
    <!-- 헤더 영역 -->
    <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-3">
        <div>
            <h2 class="page-title">지시서 관리</h2>
        </div>
        <div class="d-flex align-items-center gap-3">
            <div class="last-update-label" id="lastUpdateLabel">- 기준</div>
            <button type="button" class="btn ai-tab-btn" id="aiRecommendTabBtn">
                <i class="bi bi-stars"></i> AI 자동 추천
            </button>
            <button type="button" class="btn btn-black rounded-pill px-4" id="openWriteModalBtn">
                <i class="bi bi-plus-lg"></i> 지시서 작성
            </button>
        </div>
    </div>

    <!-- 일반 리스트 뷰 -->
    <div id="normalListSection">
        <div class="filter-section d-flex flex-wrap align-items-center gap-3">
            <div class="d-flex gap-2">
                <button class="filter-pill active" data-status="all" onclick="setStatusFilter('all', this)">전체 <span class="count" id="pillAllCount">0</span></button>
                <button class="filter-pill" data-status="대기" onclick="setStatusFilter('대기', this)">대기 <span class="count" id="pillWaitingCount">0</span></button>
                <button class="filter-pill" data-status="진행중" onclick="setStatusFilter('진행중', this)">수행 중 <span class="count" id="pillProgressCount">0</span></button>
                <button class="filter-pill" data-status="완료" onclick="setStatusFilter('완료', this)">완료 <span class="count" id="pillCompletedCount">0</span></button>
            </div>
            <div class="d-flex gap-2 flex-wrap" id="districtChipGroup"></div>
        </div>

        <div class="order-list" id="orderList"></div>
    </div>

</div>

<!-- [모달] AI 자동 추천 재배치 -->
<div class="modal fade" id="aiRecommendModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg" style="max-width: 780px;">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-stars text-purple"></i> AI 자동 추천 재배치</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="ai-recommend-card border-0 p-0">
                    <div class="ai-recommend-header">
                        <div class="ai-recommend-subtitle mt-0">실시간 재고 데이터를 분석해 우선순위가 높은 재배치 건을 자동으로 추천합니다.</div>
                        <button type="button" class="btn-send-selected" id="sendSelectedBtn">선택 항목 일괄 발송</button>
                    </div>
                    <div class="ai-select-all-row">
                        <input type="checkbox" id="aiSelectAll">
                        <label for="aiSelectAll">전체 선택</label>
                        <span class="ai-selected-count" id="aiSelectedCount">0건 선택됨</span>
                    </div>
                    <div id="aiRecommendList"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- [모달] 지시서 작성 폼 -->
<div class="modal fade" id="dispatchModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg" style="max-width: 850px;">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">지시서 작성</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <div class="row g-4">
                    <!-- 좌측: 지시 내용 (경로, 수량) -->
                    <div class="col-lg-6">
                        <!-- 긴급 토글 -->
                        <div class="form-section emergency-box">
                            <div>
                                <h6>긴급 지시서</h6>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="emergencyToggle">
                            </div>
                        </div>

                        <!-- 재배치 경로: 출발지 -->
                        <div class="form-section">
                            <label class="section-title"><i class="bi bi-circle-fill text-danger me-1" style="font-size:0.5rem"></i> 수거 대여소 (출발지)</label>
                            <div class="row g-2">
                                <div class="col-12 col-sm-4"><select class="form-select form-select-sm bg-light" id="fromDistrictSelect"><option value="">자치구</option></select></div>
                                <div class="col-12 col-sm-4"><select class="form-select form-select-sm bg-light" id="fromDongSelect"><option value="">행정동</option></select></div>
                                <div class="col-12 col-sm-4"><select class="form-select form-select-sm bg-light" id="fromStationSelect"><option value="">대여소</option></select></div>
                            </div>
                        </div>

                        <!-- 재배치 경로: 도착지 -->
                        <div class="form-section">
                            <label class="section-title"><i class="bi bi-circle-fill text-success me-1" style="font-size:0.5rem"></i> 배치 대여소 (도착지)</label>
                            <div class="row g-2">
                                <div class="col-12 col-sm-4"><select class="form-select form-select-sm bg-light" id="toDistrictSelect"><option value="">자치구</option></select></div>
                                <div class="col-12 col-sm-4"><select class="form-select form-select-sm bg-light" id="toDongSelect"><option value="">행정동</option></select></div>
                                <div class="col-12 col-sm-4"><select class="form-select form-select-sm bg-light" id="toStationSelect"><option value="">대여소</option></select></div>
                            </div>
                        </div>

                        <!-- 수량 카운터 -->
                        <div class="form-section mb-0">
                            <label class="section-title">따릉이 수량</label>
                            <div class="counter-grid">
                                <div class="counter-box">
                                    <span class="bike-label">🚲 일반 따릉이 <span class="max-label" id="normalMaxLabel">(최대 0대)</span></span>
                                    <div class="counter-controls">
                                        <button type="button" class="counter-btn" onclick="updateCount('normal', -1)">-</button>
                                        <span class="counter-val" id="normalCount">0</span>
                                        <button type="button" class="counter-btn" onclick="updateCount('normal', 1)">+</button>
                                    </div>
                                </div>
                                <div class="counter-box">
                                    <span class="bike-label">🌱 새싹 따릉이 <span class="max-label" id="sproutMaxLabel">(최대 0대)</span></span>
                                    <div class="counter-controls">
                                        <button type="button" class="counter-btn" onclick="updateCount('sprout', -1)">-</button>
                                        <span class="counter-val" id="sproutCount">0</span>
                                        <button type="button" class="counter-btn" onclick="updateCount('sprout', 1)">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 우측: 배정 및 기타 사항 (기사 배정, 메모) -->
                    <div class="col-lg-6 d-flex flex-column">
                        <!-- 기사 배정 -->
                        <div class="form-section flex-grow-1">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <label class="section-title mb-0">담당 기사 배정</label>
                                <span class="badge bg-light text-secondary border" id="driverWaitingBadge">대기 중 0명</span>
                            </div>

                            <!-- 기사 리스트 -->
                            <div class="driver-list" id="driverList"></div>
                        </div>

                        <!-- 메모 -->
                        <div class="form-section mb-0 mt-3">
                            <label class="section-title">메모 (선택)</label>
                            <textarea class="form-control bg-light" rows="3" placeholder="예: 홍대입구역 주변 행사로 인한 긴급 보충" id="orderMemo"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-light border fw-bold px-4" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-black rounded-3 px-4" id="submitOrderBtn">✈ 지시서 전송</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5.3.3 JS Bundle CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- 공통 헤더 JS -->
<script src="js/header.js"></script>
<!-- 모의 데이터(DB 객체) 스크립트를 먼저 로드 -->
<script src="js/mock_data.js"></script>
<!-- 지시서 관리 전용 JS -->
<script src="js/admin_dispatch.js"></script>
</body>
</html>
