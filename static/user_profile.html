<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 프로필 및 설정 - 서울시 따릉이</title>
  <!-- Bootstrap 5.3.3 CSS CDN -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- 프로필 전용 CSS -->
  <link rel="stylesheet" href="css/admin_profile.css" />
  <style>
    @media (max-width: 767.98px) { body { padding-bottom: 70px; } }
  </style>
</head>
<body class="bg-light">
  <div class="profile-wrap">
    <!-- 상단 뒤로가기 -->
    <a href="user_dashboard.html" class="profile-back mb-3"><i class="bi bi-arrow-left"></i> 실시간 현황으로 돌아가기</a>

    <!-- 프로필 상단 카드 (배너 및 아바타) -->
    <div class="profile-top-card">
      <div class="profile-banner"></div>
      <div class="profile-main-info">
        <div class="profile-avatar-box" id="profileAvatarInitial" style="background-color: #00965e;">홍</div>
        <button class="btn btn-dark btn-sm profile-edit-btn" data-bs-toggle="modal" data-bs-target="#profileModal">
          <i class="bi bi-pencil-fill me-1"></i> 회원정보 수정
        </button>
      </div>
      <div class="profile-name-area mt-2">
        <h4 class="fw-bold mb-1" id="profileNameDisplay">홍길동</h4>
        <span class="badge bg-success-subtle text-success fw-semibold px-2 py-1">일반 이용자</span>
        <div class="text-muted small mt-1 font-monospace" id="profileIdDisplay">user1234</div>
      </div>
    </div>

    <!-- 기본 정보 카드 -->
    <div class="profile-card">
      <h6 class="fw-bold mb-3">계정 기본 정보</h6>

      <div class="mb-3">
        <label class="form-label text-muted small fw-semibold">아이디</label>
        <div class="profile-info-box" id="infoLoginId">user1234</div>
      </div>

      <div class="mb-3">
        <label class="form-label text-muted small fw-semibold">이름</label>
        <div class="profile-info-box" id="infoName">홍길동</div>
      </div>

      <div class="mb-3">
        <label class="form-label text-muted small fw-semibold">역할</label>
        <div class="profile-info-box">일반 이용자</div>
      </div>

      <div class="mb-0">
        <label class="form-label text-muted small fw-semibold">가입일</label>
        <div class="profile-info-box" id="infoJoinedDate">2026-07-21</div>
      </div>
    </div>

    <!-- 보안 설정 카드 (비밀번호 변경) -->
    <div class="profile-card">
      <h6 class="fw-bold mb-3">보안 설정</h6>
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <div class="fw-semibold small">비밀번호 관리</div>
          <div class="text-muted" style="font-size: 0.78rem;">주기적인 비밀번호 변경으로 계정을 안전하게 보호하세요.</div>
        </div>
        <button class="btn btn-outline-dark btn-sm fw-semibold" data-bs-toggle="modal" data-bs-target="#passwordModal">
          비밀번호 변경
        </button>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4 px-2">
      <button type="button" class="btn btn-outline-danger btn-sm fw-semibold" id="withdrawBtn">
        <i class="bi bi-person-x me-1"></i> 회원 탈퇴
      </button>
      <button type="button" class="btn btn-dark btn-sm fw-semibold px-4" id="logoutBtn">
        <i class="bi bi-box-arrow-right me-1"></i> 로그아웃
      </button>
    </div>
  </div>

  <!-- [모달] 회원 정보 수정 -->
  <div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 rounded-4 shadow">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold">회원정보 수정</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="profileForm">
            <div class="mb-3">
              <label for="editName" class="form-label fw-semibold small">이름</label>
              <input type="text" class="form-control" id="editName" placeholder="이름을 입력하세요">
            </div>
          </form>
        </div>
        <div class="modal-footer border-top bg-light rounded-bottom-4">
          <button type="button" class="btn btn-light border fw-semibold" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-dark fw-semibold" id="saveProfileBtn">변경사항 저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- [모달] 비밀번호 변경 -->
  <div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 rounded-4 shadow">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold">비밀번호 변경</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="passwordForm">
            <div class="mb-3">
              <label for="curPw" class="form-label fw-semibold small">현재 비밀번호</label>
              <input type="password" class="form-control" id="curPw" placeholder="현재 비밀번호 입력">
            </div>
            <div class="mb-3">
              <label for="newPw" class="form-label fw-semibold small">새 비밀번호</label>
              <input type="password" class="form-control" id="newPw" placeholder="영문·숫자·특수문자 조합 8~16자">
            </div>
            <div class="mb-3">
              <label for="newPwConfirm" class="form-label fw-semibold small">새 비밀번호 확인</label>
              <input type="password" class="form-control" id="newPwConfirm" placeholder="새 비밀번호 다시 입력">
            </div>
          </form>
        </div>
        <div class="modal-footer border-top bg-light rounded-bottom-4">
          <button type="button" class="btn btn-light border fw-semibold" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-dark fw-semibold" id="savePasswordBtn">비밀번호 변경</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5.3 JS Bundle CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <!-- 공통 헤더 JS -->
  <script src="js/header.js"></script>
  <!-- 모의 데이터 JS -->
  <script src="js/mock_data.js"></script>
  <!-- 이용자 프로필/설정 전용 JS -->
  <script src="js/user_profile.js"></script>
</body>
</html>
