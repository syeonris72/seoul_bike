<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>설정 - 따릉이 재배치 기사</title>
  <!-- Bootstrap 5.3.3 CSS CDN -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- 드라이버 설정 전용 CSS -->
  <link rel="stylesheet" href="css/driver_settings.css" />
</head>
<body>

  <div class="settings-wrap">
    <a href="driver_dashboard.html" class="settings-back"><i class="bi bi-arrow-left"></i> 작업 화면으로 돌아가기</a>
    <h3 class="fw-bold mt-3 mb-4">설정</h3>

    <!-- 계정 관리 -->
    <section class="settings-card" aria-label="계정">
      <h6><i class="bi bi-person-circle me-2"></i>계정 관리</h6>

      <a href="#" class="settings-row text-decoration-none text-reset" data-bs-toggle="modal" data-bs-target="#profileEditModal">
        <div>
          <div class="row-title"><i class="bi bi-pencil-square me-1"></i>회원 정보 변경</div>
          <div class="row-desc">이름, 연락처, 이메일 수정</div>
        </div>
        <i class="bi bi-chevron-right text-muted"></i>
      </a>

      <a href="#" class="settings-row text-decoration-none text-reset" data-bs-toggle="modal" data-bs-target="#passwordModal">
        <div>
          <div class="row-title"><i class="bi bi-lock me-1"></i>비밀번호 변경</div>
          <div class="row-desc">계정 보안을 위한 비밀번호 재설정</div>
        </div>
        <i class="bi bi-chevron-right text-muted"></i>
      </a>
    </section>

    <!-- 시스템 정보 -->
    <section class="settings-card" aria-label="시스템">
      <h6><i class="bi bi-info-circle me-2"></i>시스템 정보</h6>
      <div class="settings-row">
        <div>
          <div class="row-title">버전 정보</div>
          <div class="row-desc">최신 버전을 사용 중입니다.</div>
        </div>
        <span class="text-muted small fw-bold">v2.4.1</span>
      </div>
    </section>

    <div class="d-flex gap-2 mt-4">
      <button type="button" class="btn btn-outline-danger w-100 py-2 fw-bold" id="logout-btn">
        <i class="bi bi-box-arrow-right me-1"></i> 로그아웃
      </button>
    </div>
  </div>

  <!-- [모달] 회원 정보 변경 -->
  <div class="modal fade" id="profileEditModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 rounded-4 shadow">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold">회원 정보 변경</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="profileForm">
            <div class="mb-3">
              <label for="editName" class="form-label fw-semibold small">이름</label>
              <input type="text" class="form-control" id="editName">
            </div>
            <div class="mb-3">
              <label for="editPhone" class="form-label fw-semibold small">연락처</label>
              <input type="text" class="form-control" id="editPhone">
            </div>
            <div class="mb-3">
              <label for="editEmail" class="form-label fw-semibold small">이메일</label>
              <input type="email" class="form-control" id="editEmail">
            </div>
          </form>
        </div>
        <div class="modal-footer border-top bg-light rounded-bottom-4">
          <button type="button" class="btn btn-light border fw-semibold" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-dark fw-semibold" id="saveProfileBtn">변경사항 저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- [모달] 비밀번호 변경 -->
  <div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 rounded-4 shadow">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold">비밀번호 변경</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="passwordForm">
            <div class="mb-3">
              <label for="currentPassword" class="form-label fw-semibold small">현재 비밀번호</label>
              <input type="password" class="form-control" id="currentPassword" placeholder="현재 비밀번호 입력">
            </div>
            <div class="mb-3">
              <label for="newPassword" class="form-label fw-semibold small">새 비밀번호</label>
              <input type="password" class="form-control" id="newPassword" placeholder="새 비밀번호 입력">
            </div>
            <div class="mb-3">
              <label for="confirmPassword" class="form-label fw-semibold small">새 비밀번호 확인</label>
              <input type="password" class="form-control" id="confirmPassword" placeholder="새 비밀번호 다시 입력">
            </div>
          </form>
        </div>
        <div class="modal-footer border-top bg-light rounded-bottom-4">
          <button type="button" class="btn btn-light border fw-semibold" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-dark fw-semibold" id="savePasswordBtn">비밀번호 변경</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5.3.3 JS Bundle CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <!-- 공통 헤더 JS -->
  <script src="js/header.js"></script>
  <script src="js/mock_data.js"></script>
  <!-- 드라이버 설정 전용 JS -->
  <script src="js/driver_settings.js"></script>
</body>
</html>
