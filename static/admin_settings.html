<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>설정 - 따릉이 관제</title>
  <!-- Bootstrap 5.3.3 CSS CDN -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- 설정 전용 CSS -->
  <link rel="stylesheet" href="css/admin_settings.css" />
</head>
<body>
  <div class="settings-wrap">
    <a href="admin_dashboard.html" class="settings-back"><i class="bi bi-arrow-left"></i> 대시보드로 돌아가기</a>
    <h3 class="fw-bold mt-3 mb-4">설정</h3>

    <!-- 계정 관리 -->
    <section class="settings-card" aria-label="계정">
      <h6><i class="bi bi-person-circle me-2"></i>계정 관리</h6>

      <a href="#" class="settings-row text-decoration-none text-reset" data-bs-toggle="modal" data-bs-target="#profileModal">
        <div>
          <div class="row-title"><i class="bi bi-pencil-square me-1"></i>회원 정보 변경</div>
          <div class="row-desc">이름, 연락처, 이메일 수정</div>
        </div>
        <i class="bi bi-chevron-right text-muted"></i>
      </a>

      <a href="#" class="settings-row text-decoration-none text-reset" data-bs-toggle="modal" data-bs-target="#passwordModal">
        <div>
          <div class="row-title"><i class="bi bi-lock me-1"></i>비밀번호 변경</div>
          <div class="row-desc">계정 보안을 위한 비밀번호 재설정</div>
        </div>
        <i class="bi bi-chevron-right text-muted"></i>
      </a>
    </section>

    <!-- 화면 및 시스템 설정 (웹 환경용) -->
    <section class="settings-card" aria-label="화면 설정">
      <h6><i class="bi bi-display me-2"></i>화면 및 대시보드 설정</h6>

      <div class="settings-row">
        <div>
          <div class="row-title">데이터 자동 새로고침</div>
          <div class="row-desc">실시간 관제 데이터 자동 갱신</div>
        </div>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch" checked />
        </div>
      </div>

      <div class="settings-row">
        <div>
          <div class="row-title">기본 지도 뷰</div>
          <div class="row-desc">대시보드 진입 시 표시될 줌 레벨</div>
        </div>
        <select class="form-select form-select-sm bg-light" style="width: 130px; border-color: #e5e7eb;">
          <option selected>자치구 단위</option>
          <option>행정동 단위</option>
          <option>스테이션 단위</option>
        </select>
      </div>
    </section>

    <div class="d-flex gap-2 mt-4">
      <button type="button" class="btn btn-outline-danger w-100 py-2 fw-bold" id="logout-btn">
        <i class="bi bi-box-arrow-right me-1"></i> 로그아웃
      </button>
    </div>

    <p class="text-center text-muted small mt-4">따릉이 관제 시스템 v2.4.1 · 서울특별시</p>
  </div>

  <!-- ==================== 모달 영역 ==================== -->
  <!-- 회원 정보 변경 모달 -->
  <div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 rounded-4 shadow">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold">회원 정보 변경</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="profileForm">
            <div class="mb-3">
              <label for="profileName" class="form-label fw-semibold small">이름</label>
              <input type="text" class="form-control" id="profileName" placeholder="이름을 입력하세요">
            </div>
            <div class="mb-3">
              <label for="profilePhone" class="form-label fw-semibold small">연락처</label>
              <input type="tel" class="form-control" id="profilePhone" placeholder="010-0000-0000">
            </div>
            <div class="mb-3">
              <label for="profileEmail" class="form-label fw-semibold small">이메일</label>
              <input type="email" class="form-control" id="profileEmail" placeholder="example@seoul.go.kr">
            </div>
          </form>
        </div>
        <div class="modal-footer border-top bg-light rounded-bottom-4">
          <button type="button" class="btn btn-light border fw-semibold" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-dark fw-semibold" id="saveProfileBtn">변경사항 저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 비밀번호 변경 모달 -->
  <div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 rounded-4 shadow">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold">비밀번호 변경</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="passwordForm">
            <div class="mb-3">
              <label for="currentPassword" class="form-label fw-semibold small">현재 비밀번호</label>
              <input type="password" class="form-control" id="currentPassword" placeholder="현재 비밀번호 입력">
            </div>
            <div class="mb-3">
              <label for="newPassword" class="form-label fw-semibold small">새 비밀번호</label>
              <input type="password" class="form-control" id="newPassword" placeholder="새 비밀번호 입력">
            </div>
            <div class="mb-3">
              <label for="confirmPassword" class="form-label fw-semibold small">새 비밀번호 확인</label>
              <input type="password" class="form-control" id="confirmPassword" placeholder="새 비밀번호 다시 입력">
            </div>
          </form>
        </div>
        <div class="modal-footer border-top bg-light rounded-bottom-4">
          <button type="button" class="btn btn-light border fw-semibold" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-dark fw-semibold" id="savePasswordBtn">비밀번호 변경</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="js/header.js"></script>
  <script src="js/admin_settings.js"></script>
</body>
</html>
