<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지시서 목록 - 따릉이 관제</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/driver_dashboard.css">
</head>
<body>

    <!-- 메인 헤더 렌더링 영역 -->
    <div id="app-header"></div>

    <!-- 서브 헤더: 상태별 탭 [전체/대기/진행 중/완료] -->
    <div class="bg-white border-bottom py-2 px-3 px-sm-4 sub-header sticky-top" style="z-index: 900;">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="status-tab-container" id="statusTabs">
                <button class="status-tab-btn active" data-status="all">전체 <span class="tab-count" id="count-all">0</span></button>
                <button class="status-tab-btn" data-status="대기">대기 <span class="tab-count" id="count-waiting">0</span></button>
                <button class="status-tab-btn" data-status="진행중">진행 중 <span class="tab-count" id="count-doing">0</span></button>
                <button class="status-tab-btn" data-status="완료">완료 <span class="tab-count" id="count-done">0</span></button>
            </div>
        </div>
    </div>

    <!-- 지시서 목록: 긴급 / 고장 수거 / 일반 재배치 3개의 박스로 항상 분리해 표시 -->
    <div id="listView" class="task-columns container-fluid mt-4 mb-5">
        <section class="task-column" data-column="urgent">
            <div class="task-column-head"><span class="dot urgent"></span>긴급 <span class="task-column-count" id="col-count-urgent">0건</span></div>
            <div class="task-column-body" id="col-urgent"></div>
        </section>
        <section class="task-column" data-column="report">
            <div class="task-column-head"><span class="dot report"></span>고장 수거 <span class="task-column-count" id="col-count-report">0건</span></div>
            <div class="task-column-body" id="col-report"></div>
        </section>
        <section class="task-column" data-column="dispatch">
            <div class="task-column-head"><span class="dot dispatch"></span>일반 재배치 <span class="task-column-count" id="col-count-dispatch">0건</span></div>
            <div class="task-column-body" id="col-dispatch"></div>
        </section>
    </div>

    <!-- QR 스캔 / 자전거 ID 입력 팝업 -->
    <div class="modal fade" id="scanModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow mx-3">
                <div class="modal-header border-bottom-0 pb-0 mt-3 px-4">
                    <h5 class="modal-title fw-bold fs-5">자전거 QR 스캔 / ID 입력</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body px-4 pb-4 mt-2">
                    <div class="scan-progress-box text-center mb-3">
                        <span class="fw-bold fs-4" id="scanProgressText">0 / 0</span>
                        <div class="text-muted small">스캔 완료된 자전거 수</div>
                    </div>
                    <div class="mb-3">
                        <div class="input-group">
                            <input type="text" class="form-control py-2 rounded-start-3 bg-light" id="scanBikeIdInput" placeholder="자전거 ID 입력 (예: BIKE-0012)">
                            <button type="button" class="btn btn-dark rounded-end-3" id="scanAddBtn"><i class="bi bi-qr-code-scan me-1"></i>스캔/추가</button>
                        </div>
                    </div>
                    <div class="scanned-list" id="scannedList"></div>
                </div>
                <div class="modal-footer border-top-0 px-4 pb-4">
                    <button type="button" class="btn btn-light border fw-bold w-100 py-2 rounded-3" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3.3 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/header.js"></script>
    <script src="js/mock_data.js"></script>
    <script src="js/driver_dashboard.js"></script>
</body>
</html>
