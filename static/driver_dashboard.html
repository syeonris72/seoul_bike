<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 작업 - 따릉이 관제</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/driver_dashboard.css">
</head>
<body>

    <!-- 메인 헤더 렌더링 영역 -->
    <div id="app-header"></div>

    <!-- 1. 서브 헤더 (탭 버튼 & 상태 요약) -->
    <div class="bg-white border-bottom py-2 px-3 px-sm-4 d-flex justify-content-between align-items-center sub-header sticky-top" style="z-index: 900;">

        <!-- 탭 버튼 (JS 함수 연결) -->
        <div class="tab-container">
            <button class="tab-btn active" id="tab-list" onclick="switchTab('list')">
                <i class="bi bi-list-ul me-1 me-sm-2"></i>지시서 목록
            </button>
            <button class="tab-btn" id="tab-map" onclick="switchTab('map')">
                <i class="bi bi-map me-1 me-sm-2"></i>경로 지도
            </button>
        </div>

        <!-- 🟢 상태 요약 카운트에 id 부여 (JS를 통해 자동 동기화됨) -->
        <div class="small fw-bold d-none d-sm-block">
            <span class="me-3"><span style="color: #adb5bd;">●</span> 대기 <span class="text-dark" id="count-waiting">0</span></span>
            <span class="me-3"><span style="color: #3b82f6;">●</span> 수행 <span class="text-dark" id="count-doing">0</span></span>
            <span><span style="color: #10b981;">●</span> 완료 <span class="text-dark" id="count-done">0</span></span>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 뷰 영역 1: 지시서 목록 (JS에서 데이터로 렌더링 됨) -->
    <!-- ========================================== -->
    <div id="listView" class="container mt-4 mb-5" style="max-width: 800px;">
        <!-- 드라이버 대시보드 JS가 이곳에 지시서를 동적으로 주입합니다. -->
    </div>

    <!-- ========================================== -->
    <!-- 뷰 영역 2: 경로 지도 (탭 누를 때 노출, 기본 숨김) -->
    <!-- ========================================== -->
    <div id="mapView" class="d-none">
        <div class="map-placeholder d-flex justify-content-center align-items-center px-3">
            <div class="empty-state-box text-center shadow-sm w-100" style="max-width: 400px;">
                <i class="bi bi-image text-muted" style="font-size: 2.5rem;"></i>
                <p class="text-muted fw-bold mb-0 mt-3" style="font-size: 1.1rem;">수행할 지시서가 없습니다</p>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 고장 신고 모달 (팝업) -->
    <!-- ========================================== -->
    <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow mx-3">
                <div class="modal-header border-bottom-0 pb-0 mt-3 px-4 position-relative text-center">
                    <h5 class="modal-title fw-bold fs-5 w-100">고장 신고 / 수거</h5>
                    <button type="button" class="btn-close position-absolute end-0 me-4" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body px-4 pb-4 mt-2 d-flex flex-column align-items-center text-center">
                    <div class="alert alert-danger bg-danger-subtle text-danger border-danger-subtle rounded-3 py-3 mb-4 w-100" style="font-size: 0.9rem;">
                        고장 자전거 번호를 입력하세요.<br>즉시 정비소 입고 대기 상태로 전환됩니다.
                    </div>
                    <div class="mb-4 w-100">
                        <input type="text" class="form-control py-3 rounded-3 bg-light text-center" placeholder="자전거 번호 (예: DDR-20481)" style="border: 1px solid #dee2e6;">
                    </div>
                    <button type="button" class="btn btn-danger w-100 fw-bold py-3 rounded-3 fs-6">
                        고장 신고 및 수거 처리
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3.3 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/header.js"></script>
    <script src="js/mock_data.js"></script>
    <script src="js/driver_dashboard.js"></script>
</body>
</html>
