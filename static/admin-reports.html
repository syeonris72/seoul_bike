<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울자전거 따릉이 - 고장 신고 관리</title>
    <link rel="icon" type="image/png" href="img/web-logo-icon.png">
    <!-- Bootstrap 5.3.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 공통 헤더 CSS -->
    <link rel="stylesheet" href="css/header.css" />
    <!-- 고장 신고 관리 전용 CSS -->
    <link rel="stylesheet" href="css/admin-reports.css?v=20260728b" />
</head>
<body>
<!-- 공유 헤더 컴포넌트 삽입 위치 -->
<div id="app-header"></div>

<div class="container-fluid px-4 reports-page-container">
    <!-- 헤더 영역 -->
    <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-3">
        <div>
            <h2 class="page-title">고장 신고 관리</h2>
            <div class="page-subtitle">이용자가 접수한 고장 신고 내역을 확인하고 처리하세요.</div>
        </div>
        <div class="d-flex align-items-center gap-3 flex-wrap header-action-group">
            <button type="button" class="btn btn-write-order px-4" id="openDispatchModalBtn">
                <i class="bi bi-plus-lg"></i> 지시서 작성
            </button>
        </div>
    </div>

    <!-- 필터 영역 -->
    <div class="d-flex flex-wrap align-items-center gap-2 mb-4">
        <div class="status-select-area position-relative" id="statusTabs">
            <button type="button" class="status-select-btn" id="statusDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="상태 필터 선택">
                <span id="statusSelectedLabel">전체</span> <span class="count" id="statusSelectedCount">0</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <ul class="dropdown-menu status-dropdown-menu" id="statusFilterList" aria-labelledby="statusDropdownBtn">
                <li><a class="dropdown-item selected-item" href="#" data-status="all">전체 <span class="count" id="count-all">0</span></a></li>
                <li><a class="dropdown-item" href="#" data-status="미배정">미배정 <span class="count" id="count-unassigned">0</span></a></li>
                <li><a class="dropdown-item" href="#" data-status="대기">대기 <span class="count" id="count-waiting">0</span></a></li>
                <li><a class="dropdown-item" href="#" data-status="진행중">수행 중 <span class="count" id="count-doing">0</span></a></li>
                <li><a class="dropdown-item" href="#" data-status="완료">완료 <span class="count" id="count-done">0</span></a></li>
            </ul>
        </div>
    </div>

    <!-- 신고 목록: 자치구별 박스로 항상 분리해 표시 -->
    <div id="districtColumns" class="task-columns mb-5"></div>
</div>

<!-- [모달] 고장 신고 지시서 작성 -->
<div class="modal fade" id="reportDispatchModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">고장 신고 지시서 작성</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="form-section">
                    <label class="section-title">고장 신고 접수 대여소</label>
                    <div class="status-select-area position-relative" id="stationSelectArea">
                        <button type="button" class="status-select-btn" id="stationDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="대여소 선택">
                            <span id="stationSelectedLabel">선택</span> <span class="count" id="stationSelectedCount"></span>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <ul class="dropdown-menu status-dropdown-menu" id="stationDropdownList" aria-labelledby="stationDropdownBtn"></ul>
                    </div>
                </div>

                <div class="form-section" id="dispatchReportSummary"></div>

                <div class="form-section mb-0">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <label class="section-title mb-0">담당 기사 배정</label>
                        <span class="badge rounded-pill bg-light text-secondary border" id="dispatchDriverWaitingBadge">대기 중 0명</span>
                    </div>
                    <div class="driver-list" id="dispatchDriverList"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-submit-dispatch w-100 py-2" id="submitReportDispatchBtn" disabled><i class="bi bi-send me-2"></i>지시서 전송</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5.3.3 JS Bundle CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- 백엔드 호출 헬퍼 -->
<script src="js/api.js"></script>
<!-- 공통 헤더 JS -->
<script src="js/header.js"></script>
<!-- 고장 신고 관리 전용 JS -->
<script src="js/admin-reports.js"></script>
</body>
</html>
